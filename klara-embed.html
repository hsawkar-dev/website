<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Secure message | Dr. Hari Sawkar, MD</title>
  <style>html,body{margin:0;padding:0;height:100%;background:transparent}</style>
</head>
<body>
  <script type="text/javascript">
    /* Klara's bundle saves "widget-state" in localStorage. When that key exists, it opens the
       widget only if the state is not "closed" AND this frame is wider than 768px (it treats
       narrower frames as phones). Otherwise it renders nothing and the box is blank. Clearing
       the key before the bundle loads makes embedded mode open every time. Do not remove. */
    try { localStorage.removeItem("widget-state"); } catch (e) {}
    window.klaraWidget = window.klaraWidget || [];
    window.klaraWidget.push(["setWidgetId", "10acdbe6-eddf-4a75-92f8-9c28e3fbfcf7"]);
    window.klaraWidget.push(["embeddedMode"]);
  </script>
  <script type="text/javascript" src="https://widget-fe.klara.com/bundle.js"></script>
</body>
</html>
