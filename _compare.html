<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portrait background — compare</title>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root{--paper:#F4F4F1;--ink:#15181E;--ink-2:#5A6068;--cobalt:#2F4FC4;--line:#E4E4DF}
    *{box-sizing:border-box;margin:0}
    body{background:var(--paper);color:var(--ink);font-family:'Hanken Grotesk',sans-serif;padding:48px 32px 80px}
    .head{max-width:1100px;margin:0 auto 40px}
    .kick{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--cobalt);margin-bottom:12px}
    h1{font-family:'Bricolage Grotesque',sans-serif;font-weight:650;font-size:34px;letter-spacing:-.02em}
    p.sub{color:var(--ink-2);font-size:16px;margin-top:10px;max-width:60ch;line-height:1.55}
    .grid{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:32px}
    figure{margin:0}
    .frame{border-radius:18px;overflow:hidden;background:#E7EAE8;aspect-ratio:4/4.3}
    .frame img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
    figcaption{margin-top:14px;display:flex;align-items:baseline;gap:10px}
    figcaption b{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:19px}
    figcaption span{font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2)}
    .tag{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--cobalt);border:1px solid color-mix(in srgb,var(--cobalt) 22%,#fff);background:color-mix(in srgb,var(--cobalt) 7%,#fff);padding:4px 9px;border-radius:999px}
    @media(max-width:820px){.grid{grid-template-columns:1fr;gap:40px}}
  </style>
</head>
<body>
  <div class="head">
    <div class="kick">Surgeon portrait &middot; choose a background</div>
    <h1>Same photo of you, two office backgrounds</h1>
    <p class="sub">Your face is identical in both — cut from your original photo, untouched. Only the office behind you differs. Tell me which you want, or ask for a tweak.</p>
  </div>
  <div class="grid">
    <figure>
      <div class="frame"><img src="assets/img/_dr-c.webp" alt="Cooler glass-wall office background"></div>
      <figcaption><b>Cooler</b><span>glass wall &middot; green trees</span><span class="tag">you haven't seen this</span></figcaption>
    </figure>
    <figure>
      <div class="frame"><img src="assets/img/dr-sawkar.webp" alt="Brighter office background"></div>
      <figcaption><b>Brighter</b><span>airy &middot; soft greenery</span><span class="tag">currently live</span></figcaption>
    </figure>
  </div>
</body>
</html>
